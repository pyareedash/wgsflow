[workspace]
name = "wgsflow-mvp"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
snakemake = ">=9.23,<10"
fastqc = ">=0.12,<1"
fastp = ">=0.24,<1"
bwa-mem2 = ">=2.2,<3"
samtools = ">=1.21,<2"
bcftools = ">=1.21,<2"
delly = ">=1.3,<2"
mosdepth = ">=0.3.10,<1"
multiqc = ">=1.28,<2"
pydantic = ">=2.10,<3"
pyyaml = ">=6,<7"
typer = ">=0.16,<1"
rich = ">=14,<16"
setuptools = ">=75,<82"
wheel = ">=0.45,<1"
pip = ">=25,<27"
pytest = ">=8.3,<10"
ruff = ">=0.12,<1"

[tasks]
install = "python -m pip install --no-deps --no-build-isolation -e ."
test = { cmd = "pytest -q", depends-on = ["install"] }
lint = { cmd = "ruff check src tests", depends-on = ["install"] }
prepare-demo = { cmd = "wgsflow data synthetic --force", depends-on = ["install"] }
doctor = { cmd = "wgsflow doctor --config config/demo.yaml", depends-on = ["prepare-demo"] }
dry-run = { cmd = "wgsflow dry-run --config config/demo.yaml --cores 2", depends-on = ["prepare-demo"] }
check = { depends-on = ["lint", "test", "dry-run"] }

smoke = { cmd = "wgsflow run --config config/demo.yaml --cores 2 --no-report", depends-on = ["prepare-demo"] }
